appId: 'dev.andyng.exogen'
productName: 'ExoGen'
copyright: 'Copyright (c) 2025 Andy Ng'
asar: true
compression: 'normal'
electronLanguages:
  - 'en-US'
files:
  - 'dist/renderer/**'
  - 'electron/**'
  - 'package.json'
  - '!**/*.map'
  - '!**/__tests__/**'
  - '!src/**'
  - '!scripts/**'
  - '!**/*.md'
# The backend runs as its own Python process; the app syncs this copy into
# userData/exogen_backend at startup (scripts/backend/sync-backend.ts).
extraResources:
  - from: 'backend'
    to: 'backend'
    filter:
      - '**/*'
      - '!.venv/**'
      - '!.cache/**'
      - '!.git/**'
      - '!tests/**'
      - '!**/__pycache__/**'
      - '!.pytest_cache/**'
      - '!.ruff_cache/**'
      - '!*.db'
      - '!static/generated_images/**'
      - '!*.egg-info/**'
      - '!openspec/**'
      - '!docs/**'
publish:
  provider: 'github'
  owner: 'andyngdz'
  repo: 'exogen'
  releaseType: 'release'
win:
  target: ['nsis', 'portable', 'zip']
  icon: 'build/icon.png'
linux:
  target: ['appimage', 'deb', 'zip']
  icon: 'build/icon.png'
  category: 'Graphics'
mac:
  target: ['dmg', 'zip']
  icon: 'build/icon.png'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: 'build/entitlements.mac.plist'
  entitlementsInherit: 'build/entitlements.mac.plist'
