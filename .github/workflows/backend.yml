# Backend (Python, uv) checks for the code in backend/. The frontend workflow
# skips backend-only changes; this one only runs for them.
name: Backend

on:
  pull_request:
    branches: [main, master, staging, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main, master, staging, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: backend

jobs:
  quality-and-tests:
    name: Ruff, ty and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Run tests with coverage
        run: uv run pytest -q --cov=app --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  sonarqube:
    name: SonarQube Analysis
    needs: [quality-and-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
